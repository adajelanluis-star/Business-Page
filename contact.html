<!DOCTYPE html>
<html>

<head>
    <title>LILO Shoes - Contact</title>
</head>

<body style="background-color: #f3e4cc; font-family: Verdana; margin: 30px;">

    <h1 style="background-color: #3b2f2f; color: white; text-align: center; padding: 15px;">
        Contact LILO
    </h1>

    <p style="text-align: center; font-size: 16px;">
        Fill out the form below if you want to contact us.
    </p>


    <form style="background-color: white; padding: 20px; border: 1px solid #3b2f2f;">

        <label style="font-weight: bold; color: #3b2f2f;">
            Name:
        </label>

        <br>

        <input type="text" style="padding: 8px;">

        <br><br>


        <label style="font-weight: bold; color: #3b2f2f;">
            Email:
        </label>

        <br>

        <input type="email" style="padding: 8px;">

        <br><br>


        <label style="font-weight: bold; color: #3b2f2f;">
            Phone:
        </label>

        <br>

        <input type="text" style="padding: 8px;">

        <br><br>


        <label style="font-weight: bold; color: #3b2f2f;">
            Choose a Product:
        </label>

        <br>

        <select style="padding: 8px;">

            <option>LILO Runner</option>
            <option>LILO Sport</option>
            <option>LILO Classic</option>
            <option>LILO Trainer</option>

        </select>

        <br><br>


        <label style="font-weight: bold; color: #3b2f2f;">
            Message:
        </label>

        <br>

        <textarea rows="5" cols="30" style="padding: 8px;"></textarea>

        <br><br>


        <input type="submit" value="Send"
               style="background-color: #3b2f2f; color: white; padding: 10px 20px;">

    </form>


    <br>

    <p style="text-align: center;">
        <a href="home.html" target="content"
           style="background-color: #e6cba8; color: #3b2f2f; padding: 10px 20px;">
            ← Back to Home
        </a>
    </p>

</body>
</html>
